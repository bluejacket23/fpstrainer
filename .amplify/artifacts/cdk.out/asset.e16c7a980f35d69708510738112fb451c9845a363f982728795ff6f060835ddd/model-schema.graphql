type User @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  userId: String! @primaryKey
  email: String
  subscriptionPlan: String
  clipsRemaining: Int
  clipsUsedThisMonth: Int
  monthStartDate: String
  stripeCustomerId: String
  stripeSubscriptionId: String
  referralCode: String
  referredBy: String
  subscriptionCancelAt: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type OpsCoachReport @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  userId: String! @primaryKey(sortKeyFields: ["reportId"])
  reportId: String!
  timestamp: String
  videoUrl: String
  frameUrls: [String]
  thumbnailUrl: String
  videoDuration: Int
  originalFilename: String
  aiReportJson: AWSJSON
  aiReportMarkdown: String
  processingStatus: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Mutation {
  initUpload(filename: String): AWSJSON @function(name: "FnInitUpload") @auth(rules: [{allow: private}])
  generateShareableGraphic(reportId: String!): AWSJSON @function(name: "FnGenerateShareableGraphic") @auth(rules: [{allow: private}])
  generateTrainingProgram(reportId: String!): AWSJSON @function(name: "FnGenerateTrainingProgram") @auth(rules: [{allow: private}])
  createCheckoutSession(planName: String!): AWSJSON @function(name: "FnCreateCheckoutSession") @auth(rules: [{allow: private}])
  cancelSubscription: AWSJSON @function(name: "FnCancelSubscription") @auth(rules: [{allow: private}])
  customerPortal: AWSJSON @function(name: "FnCustomerPortal") @auth(rules: [{allow: private}])
}

type Query {
  getReportCustom(userId: String!, reportId: String!): AWSJSON @function(name: "FnGetReportCustom") @auth(rules: [{allow: private}])
  listReportsCustom: [AWSJSON] @function(name: "FnListReportsCustom") @auth(rules: [{allow: private}])
}